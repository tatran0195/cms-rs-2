[package]
name = "cms-worker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cms-worker"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["full"] }
cms-biz = { path = "../cms-biz" }
cms-db = { path = "../cms-db" }
cms-queue = { path = "../cms-queue" }
cms-storage = { path = "../cms-storage" }
cms-search = { path = "../cms-search" }
cms-config = { path = "../cms-config" }
cms-error = { path = "../cms-error" }
cms-middleware = { path = "../cms-middleware" }
cms-analytics = { path = "../cms-analytics" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }

# Email delivery
lettre = { workspace = true }
anyhow = { workspace = true }

[features]
default = []
redis = []

[lints]
workspace = true
